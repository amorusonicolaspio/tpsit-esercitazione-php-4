<!DOCTYPE html>
<html lang="it">

        <form action="esercitazione4Calcolo.php" method="post">

                </tr>
                <tr>
                    <td class="etichetta">Stato</td>

                        <input type="radio" name="stato" value="Nuova"> Nuova

                </tr>
                <tr>
                    <td class="etichetta">Anno Costruzione</td>

                            <option value="2014">2014</option>
                            <option value="2015">2015</option>
                            <option value="2016">2016</option>
                            <option value="2017">2017</option>
                            <option value="2018">2018</option>
                            <option value="2019">2019</option>
                            <option value="2020">2020</option>
                            <option value="2021">2021</option>
                            <option value="2022">2022</option>
                            <option value="2023">2023</option>
                            <option value="2024">2024</option>
                            <option value="2025">2025</option>
                            <option value="2026">2026</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td class="etichetta">Cilindrata</td>
                    <td><input type="number" name="cilindrata" class="input-corto"></td>
                </tr>
                <tr>
                    <td class="etichetta">Cavalli</td>
                    <td><input type="number" name="cavalli" class="input-corto"></td>
                </tr>
                <tr>
                    <td class="etichetta">Prezzo</td>
                    <td><input type="number" name="prezzo" class="input-prezzo"> Euro</td>
                </tr>
                <tr>
                    <td class="etichetta">Targa</td>
                    <td><input type="text" name="targa" class="input-targa"></td>

                <tr>
                    <td class="etichetta">Accessori</td>

                        <input type="checkbox" name="accessori[]" value="Aria Condizionata"> Aria Condizionata<br>

                        <input type="checkbox" name="accessori[]" value="Impianto Radio-CD"> Impianto Radio-CD

                </tr>
                <tr>

                        <textarea name="descrizione"></textarea>
                    </td>
                </tr>
            </table>

            <div class="pulsanti">
                <input type="submit" value="Invia">
                <input type="reset" value="Cancella">
